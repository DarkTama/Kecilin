name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # tauri-action creates the Release and uploads assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tag pushes release under the pushed tag; manual dispatch derives the
      # tag from tauri.conf.json (v<version>) and creates it at HEAD.
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Rust first: fetch-binaries.ps1 derives the target triple from rustc.
      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # postinstall runs scripts/fetch-binaries.ps1 (downloads + SHA-256-verifies
      # a pinned BtbN ffmpeg build into src-tauri/binaries/) — the gitignored sidecar.
      - name: Install deps (runs fetch-binaries via postinstall)
        run: npm ci

      - name: Ensure bundled binaries present
        run: npm run fetch-binaries

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Builds the frontend + Rust, produces the NSIS installer, creates the
      # GitHub Release and uploads the installer.
      - name: Build app + create Release (NSIS)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: 'Kecilin ${{ steps.tag.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Kecilin ${{ steps.tag.outputs.tag }} (Windows x64)

            Assets:
            - `Kecilin_*_x64-setup.exe` — installer
            - `Kecilin-*-portable-win64.zip` — portable (unzip and run kecilin.exe)

            Builds are unsigned — Windows SmartScreen may warn on first run
            ("More info" → "Run anyway"). Requires the WebView2 runtime
            (preinstalled on Windows 11 / most Windows 10).

      # Assemble a portable ZIP: the app exe plus the ffmpeg sidecar under the
      # plain name Tauri resolves at runtime (exe_dir/ffmpeg.exe).
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'src-tauri/target/release'
          $bin = 'src-tauri/binaries'
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "$rel/kecilin.exe" $stage -Force
          Copy-Item "$bin/ffmpeg-x86_64-pc-windows-msvc.exe" (Join-Path $stage 'ffmpeg.exe') -Force
          if (Test-Path "$rel/WebView2Loader.dll") { Copy-Item "$rel/WebView2Loader.dll" $stage -Force }

          $zip = "Kecilin-$ver-portable-win64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload portable ZIP to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.tag.outputs.tag }} "$env:PORTABLE_ZIP" --clobber

  # Linux build (.deb + AppImage) — uses the system ffmpeg (a package
  # dependency) instead of a bundled sidecar; feeds the AUR kecilin-bin
  # recipe in packaging/aur/. `needs: release` so the GitHub Release exists
  # before we upload to it.
  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install deps (postinstall skips the Windows sidecar here)
        run: npm ci

      - name: Run tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build .deb + AppImage
        run: npm run tauri build

      - name: Upload Linux bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage --clobber
